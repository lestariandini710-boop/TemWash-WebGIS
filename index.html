<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TemWash WebGIS Laundry Self Service Tembalang"
    >

    <title>TemWash | WebGIS Laundry Tembalang</title>

    <!-- Font DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS Leaflet untuk menampilkan peta -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <!-- CSS buatan sendiri -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!--
        Seluruh halaman TemWash akan ditampilkan
        melalui JavaScript di dalam elemen ini.
    -->
    <div id="app"></div>

    <!-- Notifikasi kecil -->
    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>

    <!-- JavaScript Leaflet -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <!-- JavaScript TemWash -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
